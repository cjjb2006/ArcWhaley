name: Whaley API21 preview
on:
  push:
    branches: [whaley-api21]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/whaley_defaults_test.dart test/providers/update_service_test.dart
      - run: flutter build apk --flavor github --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ArcWhaley-api21-preview
          path: build/app/outputs/flutter-apk/*github-debug.apk
          retention-days: 14
